<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tradewinds: two arrows chasing each other = an exchange in motion -->
  <defs>
    <marker id="teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="72" markerHeight="72"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#2DD4BF"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="72" markerHeight="72"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#F59E0B"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C33"/>
      <stop offset="1" stop-color="#070B16"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- faint compass ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#1E293B" stroke-width="6"/>
  <!-- wind streaks -->
  <g stroke="#334155" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="58" y1="256" x2="118" y2="256"/>
    <line x1="80" y1="288" x2="126" y2="288"/>
    <line x1="394" y1="256" x2="454" y2="256"/>
    <line x1="386" y1="224" x2="432" y2="224"/>
  </g>
  <!-- top arrow: teal, sweeping left → right, turning down -->
  <path d="M132 214 A150 150 0 0 1 380 214" fill="none" stroke="#2DD4BF" stroke-width="36"
        stroke-linecap="round" marker-end="url(#teal)"/>
  <!-- bottom arrow: amber, sweeping right → left, turning up -->
  <path d="M380 298 A150 150 0 0 1 132 298" fill="none" stroke="#F59E0B" stroke-width="36"
        stroke-linecap="round" marker-end="url(#amber)"/>
  <!-- pivot -->
  <circle cx="256" cy="256" r="22" fill="#F8FAFC"/>
</svg>
