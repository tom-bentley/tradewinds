<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tradewinds — Sleeper trade analyzer</title>
<meta name="description" content="On-the-spot Sleeper trade analyzer: consensus values, lineup impact, and the best trades to propose.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0B1220" id="meta-theme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tradewinds">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script>
/* Set the theme before first paint. Dark is the default; "system" follows the phone. */
try { document.documentElement.dataset.theme = localStorage.getItem("tradewinds.theme") || "dark"; }
catch (e) { document.documentElement.dataset.theme = "dark"; }
</script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<div id="app">

  <header id="hdr">
    <div class="hdr-top">
      <span class="brand">
        <svg class="mark" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true" fill="none" stroke-width="3.2" stroke-linecap="round">
          <path d="M27 12.5A12 12 0 0 0 5.6 10.4" stroke="#2DD4BF"/><path d="M27.4 5.6l.2 7.2-7.1.4" stroke="#2DD4BF"/>
          <path d="M5 19.5a12 12 0 0 0 21.4 2.1" stroke="#F59E0B"/><path d="M4.6 26.4l-.2-7.2 7.1-.4" stroke="#F59E0B"/>
        </svg>
        <span class="wordmark">Tradewinds</span>
        <span class="hdr-league" id="hdr-league"></span>
        <span class="wkpill num" id="hdr-week"></span>
      </span>
      <button type="button" id="btn-refresh" class="icon-btn" aria-label="Refresh live rosters and values">
        <svg class="ic" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 10a7 7 0 1 1-2.1-5"/><path d="M17 3v4h-4"/>
        </svg>
      </button>
    </div>
    <div class="rail" id="hdr-fresh"></div>
  </header>

  <p id="banner" class="banner" hidden></p>

  <main id="main">
    <div id="view"></div>
  </main>

  <nav id="tabs" role="tablist" aria-label="Sections">
    <a href="#deals" data-tab="deals" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l8.5 4.2L12 11.4 3.5 7.2z"/><path d="M3.5 12.2L12 16.4l8.5-4.2"/><path d="M3.5 16.8L12 21l8.5-4.2"/>
      </svg><span>Deals</span></a>
    <a href="#analyze" data-tab="analyze" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 8.5h15l-4-4"/><path d="M20.5 15.5h-15l4 4"/>
      </svg><span>Analyze</span></a>
    <a href="#league" data-tab="league" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 10h18"/><path d="M14.5 10v9.5"/>
      </svg><span>League</span><i class="tab-dot" hidden aria-hidden="true"></i></a>
    <a href="#players" data-tab="players" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L20.5 20.5"/>
      </svg><span>Players</span></a>
    <a href="#settings" data-tab="settings" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7h9M17 7h4M3 12h5M13 12h8M3 17h11M19 17h2"/>
        <circle cx="14.5" cy="7" r="2.1"/><circle cx="10.5" cy="12" r="2.1"/><circle cx="16.5" cy="17" r="2.1"/>
      </svg><span>Settings</span></a>
  </nav>

</div>

<div id="sheet-host" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>

<noscript>
  <div class="noscript">
    <h1>Tradewinds needs JavaScript</h1>
    <p>The trade engine runs entirely in your browser — there is no server to fall back to.
      Turn JavaScript on for this site and reload.</p>
  </div>
</noscript>

<script type="module" src="src/ui/app.js"></script>
</body>
</html>
